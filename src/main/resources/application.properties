spring.application.name=order-processing-system

# Carrega o .env local (se existir) como propriedades; variáveis de ambiente reais têm precedência.
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=dev

# O schema é versionado pelo Flyway (db/migration); o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics

spring.jpa.open-in-view=false